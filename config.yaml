# Clea configuration — tuned for ASUS ROG Strix 16 (i9, 16GB RAM, RTX 4070 Laptop 8GB VRAM).
# Every GPU-touching stage runs SEQUENTIALLY (never concurrently) to respect the 8GB VRAM ceiling.

video:
  width: 1080            # 9:16 vertical for Instagram Reels
  height: 1920
  fps: 30
  target_duration: 20.0  # seconds; clamped to [min_duration, max_duration]
  min_duration: 15.0
  max_duration: 30.0

encoder:
  # "auto" probes for NVENC at startup and falls back to libx264 if unavailable.
  # Force with "nvenc" or "cpu".
  mode: auto
  nvenc_args: ["-c:v", "h264_nvenc", "-preset", "p5", "-tune", "hq",
               "-rc", "vbr", "-cq", "19", "-b:v", "0",
               "-maxrate", "20M", "-bufsize", "40M", "-profile:v", "high"]
  cpu_args:   ["-c:v", "libx264", "-preset", "fast", "-crf", "18", "-profile:v", "high"]
  audio_args: ["-c:a", "aac", "-b:a", "192k"]

pacing:                    # base pacing; style presets below override per-reel
  hook_seconds: 6.0        # opening section gets the fastest cuts + best-scored material
  hook_min_cut: 0.45       # shortest allowed cut length (s) during the hook
  body_min_cut: 0.95       # shortest allowed cut length (s) after the hook
  max_cut: 2.5             # never hold a single shot longer than this
  strong_beat_percentile: 60  # onset strength >= this percentile => "strong" beat
  crossfade: 0.20          # seconds; soft transitions on weak beats

# Reel style presets — tuned for what performs on dental Instagram.
# `defaults` pre-set captions/notes/keep_voice but explicit flags always win.
# ordering: hook_first (best material opens) | chronological (before -> after)
# transitions: standard (hard cut on strong, crossfade on weak)
#            | flash (white-flash pop on strong beats, hard cut on weak)
styles:
  informational:           # "did you know" clinic content, voiceover-led
    pacing: {hook_seconds: 5.0, hook_min_cut: 0.60, body_min_cut: 1.20,
             max_cut: 3.0, strong_beat_percentile: 60, crossfade: 0.22}
    defaults: {captions: true, notes: true, keep_voice: true}
    ordering: hook_first
    transitions: standard
    punch_in: false
  cool-edit:               # hype montage: fast cuts, beat flashes, punch-ins
    pacing: {hook_seconds: 7.0, hook_min_cut: 0.35, body_min_cut: 0.70,
             max_cut: 1.6, strong_beat_percentile: 75, crossfade: 0.12}
    defaults: {captions: false, notes: false, keep_voice: false}
    ordering: hook_first
    transitions: flash
    punch_in: true
  educational:             # explainer / exam-prep, slower and clearer
    pacing: {hook_seconds: 5.0, hook_min_cut: 0.70, body_min_cut: 1.40,
             max_cut: 3.5, strong_beat_percentile: 55, crossfade: 0.25}
    defaults: {captions: true, notes: true, keep_voice: true}
    ordering: hook_first
    transitions: standard
    punch_in: false
  case-study:              # before/after review: clip order preserved
    pacing: {hook_seconds: 4.0, hook_min_cut: 0.80, body_min_cut: 1.50,
             max_cut: 3.5, strong_beat_percentile: 60, crossfade: 0.25}
    defaults: {captions: true, notes: true, keep_voice: true}
    ordering: chronological
    transitions: standard
    punch_in: false

hook_title:                # optional big opening title (--hook-text)
  font_size: 88
  seconds: 2.2
  color: "#FFD400"

scoring:
  sample_fps: 4.0          # frames/second analysed per clip (downscaled greyscale)
  analysis_width: 160      # px; analysis resolution, not output resolution
  repeat_clip_penalty: 0.15  # discourage the same clip in consecutive slots

captions:                  # Phase 2 — word-by-word highlight style
  font: Arial              # must be installed on the rendering machine
  font_size: 68
  outline: 4               # black outline thickness (px at 1080x1920)
  highlight_color: "#FFD400"   # currently-spoken word
  margin_v: 460            # px above bottom edge — clears the Reels UI zone
  max_words_per_line: 4

notes:                     # Phase 3 — informational note-card overlays
  max_notes: 4             # 2-4 key factual sentences from the transcript
  display_seconds: 3.5
  font_size: 52
  text_color: "#FFFFFF"
  bg_color: "#101828"      # card background (BorderStyle=3 box)
  bg_alpha: 0x50           # 0x00 opaque .. 0xFF invisible
  margin_top: 300          # px from top edge
  use_llm: true            # compress via local Ollama when running; heuristic otherwise

audio_mix:
  music_volume: 1.0
  music_volume_with_voice: 0.25  # duck music under speech when --keep-voice
  voice_volume: 1.0

whisper:                   # Phase 2
  model: medium            # 8GB VRAM: "medium" fits comfortably since stages run sequentially
  device: auto             # auto -> cuda if available, else cpu
  cpu_fallback_model: small
  compute_type_gpu: float16
  compute_type_cpu: int8

llm:                       # Phase 4
  provider: ollama         # fully local by default; no paid API needed
  ollama_url: http://localhost:11434
  model: qwen2.5:7b        # fits fully in 8GB VRAM; swap to qwen3:14b / llama3.2:3b here
  # Optional cloud fallback for higher-quality output. The app runs fully without it.
  cloud_provider: null     # anthropic | groq | gemini | null
  cloud_api_key: null      # or set env var CLEA_CLOUD_API_KEY

imagegen:                 # Phase 7 — illustrative AI images for "no raw footage" reels
  model: stabilityai/sdxl-turbo   # fits 8GB VRAM; 1-4 step inference, no CFG needed
  device: auto              # auto -> cuda if available, else cpu (slow)
  steps: 2                  # sdxl-turbo sweet spot is 1-4 steps
  guidance_scale: 0.0       # 0 = turbo mode (no negative-prompt CFG pass, much faster)
  width: 768
  height: 768                # square gen resolution; kenburns crops to 9:16 after
  seconds_per_image: 4.0     # length of each Ken Burns clip before beat-cutting
  max_scenes: 5               # cap on generated images per topic (GPU time control)

music_library:            # pick-from-list music (like a Reels song picker)
  dir: music_library/tracks       # drop your own royalty-free/licensed tracks here
  manifest: music_library/manifest.json  # auto-generated; do not hand-edit tempo/duration

paths:
  output_dir: output
